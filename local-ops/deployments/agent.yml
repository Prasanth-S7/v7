apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deployment
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent-container
          image: v7-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: agent-secret