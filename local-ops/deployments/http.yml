apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-deployment
  labels:
    app: http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http
  template:
    metadata:
      labels:
        app: http
    spec:
      containers:
        - name: http-container
          image: v7-http:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: http-secret
---
apiVersion: v1
kind: Service
metadata:
  name: http-service
  namespace: default
spec:
  selector:
    app: http
  ports:
    - port: 8080
      targetPort: 3000
      nodePort: 30080
  type: NodePort